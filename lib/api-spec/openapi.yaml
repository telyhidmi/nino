openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /messaging/profile:
    get:
      operationId: getMessagingProfile
      security: [{bearerAuth: []}]
      description: Sync the signed-in member's public profile for display-name discovery. Call on authenticated app entry.
      responses:
        "200":
          description: Your public profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingProfile"}
        default:
          $ref: "#/components/responses/MessagingFailure"
  /messaging/people:
    get:
      operationId: searchMessagingPeople
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: q, required: true, schema: {type: string, minLength: 2, maxLength: 80}}
      responses:
        "200":
          description: Up to 20 public profiles by case-insensitive display-name or username prefix, excluding yourself. Directory members sync their profile on signed-in app entry. Never searches or returns email.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MessagingProfile"}}
        default:
          $ref: "#/components/responses/MessagingFailure"
  /messaging/people/{id}/relationship:
    get:
      operationId: getMessagingRelationship
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      description: Authenticated persisted follow relationship. Verifies the target exists in Clerk and syncs public profiles. Self targets receive 400, missing members 404.
      responses:
        "200":
          description: Relationship from your perspective
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingRelationship"}
        default:
          $ref: "#/components/responses/MessagingFailure"
    put:
      operationId: setMessagingRelationship
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      description: Idempotently follow or unfollow a verified Clerk member as the authenticated caller. Client demo follows are not authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MessagingRelationshipInput"}
      responses:
        "200":
          description: Updated persisted relationship
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingRelationship"}
        default:
          $ref: "#/components/responses/MessagingFailure"
  /messaging/conversations:
    get:
      operationId: listMessagingConversations
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: cursor, schema: {type: string, maxLength: 300}}
      responses:
        "200":
          description: Most recently active first, 30 per page. Fetching does not mark read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingInbox"}
        default:
          $ref: "#/components/responses/MessagingFailure"
    post:
      operationId: createMessagingConversation
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MessagingConversationInput"}
      responses:
        "200":
          description: Existing or new deduplicated one-to-one conversation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingConversation"}
        default:
          $ref: "#/components/responses/MessagingFailure"
  /messaging/conversations/{id}/messages:
    get:
      operationId: listMessagingMessages
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 300}}
      responses:
        "200":
          description: 50 messages newest first, cursor fetches older messages. Does not mark read. Outsiders receive 404.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingThread"}
        default:
          $ref: "#/components/responses/MessagingFailure"
    post:
      operationId: sendMessagingMessage
      description: Transactionally allows mutual followers unrestricted messages; otherwise each sender can send two initial messages until the peer replies. Once both have sent a message the conversation is permanently unrestricted even after unfollowing. Existing messages count. An identical nonce retry returns the existing message before policy checks.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MessagingMessageInput"}
      responses:
        "200":
          description: Persisted message. Reuse nonce on retry; different content or conversation with same sender nonce receives 409.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingMessage"}
        "403":
          description: Two initial messages already sent; wait for the peer to reply or become mutual followers.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingFailure"}
        default:
          $ref: "#/components/responses/MessagingFailure"
  /messaging/conversations/{id}/read:
    post:
      operationId: markMessagingRead
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      description: Only call while viewing the thread, with the newest actually displayed message ID. Monotonic watermark never reads concurrent later sends.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MessagingReadInput"}
      responses:
        "200":
          description: Updated read state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagingReadState"}
        default:
          $ref: "#/components/responses/MessagingFailure"
  /live:
    get:
      operationId: listLiveStreams
      tags: [live]
      security: [{bearerAuth: []}]
      description: Only Nino rooms with a connected host publishing an unmuted camera track are discoverable.
      responses:
        "200":
          description: Active broadcasts, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/LiveUnavailable"
    post:
      operationId: createLiveStream
      tags: [live]
      security: [{bearerAuth: []}]
      description: One room per authenticated owner. Retrying returns the existing room and original metadata. Connect and publish camera to appear in discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveStreamInput"
      responses:
        "200":
          description: Host connection credentials; never cache or log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveJoin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/LiveUnavailable"
  /live/{id}/join:
    post:
      operationId: joinLiveStream
      tags: [live]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      description: Viewers receive subscribe and chat-data grants only. Owner may reconnect even before publishing.
      responses:
        "200":
          description: Connection credentials; never cache or log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveJoin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/LiveUnavailable"
  /live/{id}:
    delete:
      operationId: endLiveStream
      tags: [live]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      description: Owner only. Deletes the LiveKit room and disconnects all participants.
      responses:
        "204":
          description: Broadcast ended
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the owner can end a broadcast
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/LiveUnavailable"
  /posts/uploads:
    post:
      operationId: requestPostUpload
      tags: [posts]
      security: [{bearerAuth: []}]
      summary: Request a private PUT upload ticket (valid for 15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUploadRequest"
      responses:
        "200":
          description: PUT the raw bytes to uploadUrl, then publish using uploadId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostUploadTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Published posts, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: publishPost
      tags: [posts]
      security: [{bearerAuth: []}]
      description: Idempotent by uploadId. Retrying returns the original post; caption cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPostRequest"
      responses:
        "200":
          description: Published post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Upload expired or post already deleted
        "422":
          description: Uploaded object size, type, or signature does not match ticket
  /posts/mine:
    get:
      operationId: listMyPosts
      tags: [posts]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Current authenticated user's posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /posts/{id}:
    delete:
      operationId: deletePost
      tags: [posts]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Post deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/media/{id}:
    get:
      operationId: getPostMedia
      tags: [posts]
      description: Public media for published, non-deleted posts. Supports single byte ranges and HEAD.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Range
          schema: {type: string}
      responses:
        "200":
          description: Media bytes
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "206":
          description: Requested byte range
        "416":
          description: Invalid or unsatisfiable byte range
        "404":
          $ref: "#/components/responses/NotFound"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    MessagingFailure:
      description: "400 invalid input/self-message/cursor; 401 no verified Clerk session; 404 missing resource or non-member; 409 sender nonce reused with different payload; 429 rate limit (Retry-After 60); 503 sanitized temporary service failure."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/MessagingFailure"}
    LiveUnavailable:
      description: Live broadcasting unavailable; sanitized error message
    Unauthorized:
      description: A verified Clerk session bearer token is required
    BadRequest:
      description: Invalid request
    NotFound:
      description: Not found or not owned by current user
  schemas:
    MessagingFailure:
      type: object
      required: [error]
      properties:
        error: {type: string}
    MessagingProfile:
      type: object
      required: [id, displayName, username, avatarUrl]
      properties:
        id: {type: string}
        displayName: {type: string}
        username: {type: ["string", "null"]}
        avatarUrl: {type: ["string", "null"]}
    MessagingConversationInput:
      type: object
      required: [peerId]
      properties:
        peerId: {type: string, minLength: 1, maxLength: 200}
    MessagingRelationshipInput:
      type: object
      additionalProperties: false
      required: [following]
      properties:
        following: {type: boolean}
    MessagingRelationship:
      type: object
      required: [following, followsYou, mutual]
      properties:
        following: {type: boolean}
        followsYou: {type: boolean}
        mutual: {type: boolean}
    MessagingPermission:
      type: object
      required: [canSend, remainingInitialMessages, awaitingReply, isMutual]
      properties:
        canSend: {type: boolean}
        remainingInitialMessages:
          type: ["integer", "null"]
          minimum: 0
          maximum: 2
          description: Null when unrestricted; otherwise 2 minus this sender's existing messages, floored at zero.
        awaitingReply:
          type: boolean
          description: True only when the initial quota is exhausted and sending is blocked pending a peer reply or mutual follows.
        isMutual: {type: boolean}
    MessagingMessageInput:
      type: object
      required: [text, clientNonce]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
        clientNonce: {type: string, format: uuid}
    MessagingReadInput:
      type: object
      required: [messageId]
      properties:
        messageId: {type: string, format: uuid}
    MessagingMessage:
      type: object
      required: [id, conversationId, senderId, text, clientNonce, sequence, createdAt]
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        senderId: {type: string}
        text: {type: string}
        clientNonce: {type: string, format: uuid}
        sequence: {type: integer}
        createdAt: {type: string}
    MessagingConversation:
      type: object
      required: [id, peer, lastMessage, unreadCount, updatedAt, relationship, messagingPermission]
      properties:
        id: {type: string, format: uuid}
        peer: {$ref: "#/components/schemas/MessagingProfile"}
        lastMessage:
          oneOf:
            - {$ref: "#/components/schemas/MessagingMessage"}
            - {type: "null"}
        unreadCount: {type: integer}
        updatedAt: {type: string}
        relationship: {$ref: "#/components/schemas/MessagingRelationship"}
        messagingPermission: {$ref: "#/components/schemas/MessagingPermission"}
    MessagingInbox:
      type: object
      required: [conversations, nextCursor]
      properties:
        conversations: {type: array, items: {$ref: "#/components/schemas/MessagingConversation"}}
        nextCursor: {type: ["string", "null"]}
    MessagingThread:
      type: object
      required: [conversation, messages, nextCursor]
      properties:
        conversation: {$ref: "#/components/schemas/MessagingConversation"}
        messages: {type: array, items: {$ref: "#/components/schemas/MessagingMessage"}}
        nextCursor: {type: ["string", "null"]}
    MessagingReadState:
      type: object
      required: [readSequence, unreadCount]
      properties:
        readSequence: {type: integer}
        unreadCount: {type: integer}
    LiveStreamInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
    LiveStream:
      type: object
      required: [id, title, hostId, hostName, viewerCount, startedAt]
      properties:
        id: {type: string}
        title: {type: string}
        hostId: {type: string}
        hostName: {type: string}
        viewerCount: {type: integer, minimum: 0}
        startedAt: {type: string, format: date-time}
    LiveStreamList:
      type: object
      required: [streams]
      properties:
        streams:
          type: array
          items:
            $ref: "#/components/schemas/LiveStream"
    LiveJoin:
      type: object
      required: [stream, serverUrl, token, isHost]
      properties:
        stream:
          $ref: "#/components/schemas/LiveStream"
        serverUrl: {type: string}
        token: {type: string}
        isHost: {type: boolean}
    PostUploadRequest:
      type: object
      additionalProperties: false
      required: [contentType, size, kind]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif, image/heic, image/heif, video/mp4, video/quicktime, video/webm]
        size:
          type: integer
          minimum: 1
          maximum: 209715200
          description: Exact byte count. Photos have a 20971520-byte limit.
        kind:
          type: string
          enum: [photo, video]
    PostUploadTicket:
      type: object
      required: [uploadId, uploadUrl]
      properties:
        uploadId: {type: string, format: uuid}
        uploadUrl: {type: string}
    PublishPostRequest:
      type: object
      additionalProperties: false
      required: [uploadId, caption]
      properties:
        uploadId: {type: string, format: uuid}
        caption: {type: string, maxLength: 2200}
        recordingLocation:
          $ref: "#/components/schemas/RecordingLocation"
    RecordingLocation:
      type: object
      additionalProperties: false
      description: Optional device-reported country at video recording time. Not verified GPS or proof of physical presence. Only accepted for videos; immutable after first publication.
      required: [countryCode, recordedAt]
      properties:
        countryCode:
          type: string
          description: Assigned ISO 3166-1 alpha-2 country code (uppercase).
          enum: [AD, AE, AF, AG, AI, AL, AM, AO, AQ, AR, AS, AT, AU, AW, AX, AZ, BA, BB, BD, BE, BF, BG, BH, BI, BJ, BL, BM, BN, BO, BQ, BR, BS, BT, BV, BW, BY, BZ, CA, CC, CD, CF, CG, CH, CI, CK, CL, CM, CN, CO, CR, CU, CV, CW, CX, CY, CZ, DE, DJ, DK, DM, DO, DZ, EC, EE, EG, EH, ER, ES, ET, FI, FJ, FK, FM, FO, FR, GA, GB, GD, GE, GF, GG, GH, GI, GL, GM, GN, GP, GQ, GR, GS, GT, GU, GW, GY, HK, HM, HN, HR, HT, HU, ID, IE, IL, IM, IN, IO, IQ, IR, IS, IT, JE, JM, JO, JP, KE, KG, KH, KI, KM, KN, KP, KR, KW, KY, KZ, LA, LB, LC, LI, LK, LR, LS, LT, LU, LV, LY, MA, MC, MD, ME, MF, MG, MH, MK, ML, MM, MN, MO, MP, MQ, MR, MS, MT, MU, MV, MW, MX, MY, MZ, NA, NC, NE, NF, NG, NI, NL, NO, NP, NR, NU, NZ, OM, PA, PE, PF, PG, PH, PK, PL, PM, PN, PR, PS, PT, PW, PY, QA, RE, RO, RS, RU, RW, SA, SB, SC, SD, SE, SG, SH, SI, SJ, SK, SL, SM, SN, SO, SR, SS, ST, SV, SX, SY, SZ, TC, TD, TF, TG, TH, TJ, TK, TL, TM, TN, TO, TR, TT, TV, TW, TZ, UA, UG, UM, US, UY, UZ, VA, VC, VE, VG, VI, VN, VU, WF, WS, YE, YT, ZA, ZM, ZW]
        recordedAt:
          type: string
          format: date-time
          description: Device-reported ISO datetime with timezone; cannot exceed server time by more than five minutes.
    Post:
      type: object
      required: [id, ownerId, caption, kind, mediaUrl, createdAt, authorName, authorAvatar, recordingLocation]
      properties:
        id: {type: string, format: uuid}
        ownerId: {type: string}
        caption: {type: string}
        kind:
          type: string
          enum: [photo, video]
        mediaUrl: {type: string}
        createdAt: {type: string, format: date-time}
        authorName: {type: string}
        authorAvatar:
          type: [string, "null"]
        recordingLocation:
          oneOf:
            - $ref: "#/components/schemas/RecordingLocation"
            - type: "null"
    PostList:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

